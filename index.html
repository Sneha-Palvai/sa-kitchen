<style>

@font-face{font-family:'Fraunces';font-style:normal;font-weight:600;font-display:swap;src:url(fraunces-latin-600-normal.woff2) format('woff2')}

*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}

label{font-size:14px}

.err{color:var(--red);font-size:14px;min-height:20px;margin:8px 0}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:15px}
.sec-h{font-size:14px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.item:first-child{border-top:0}
.sl{width:70px;flex:none;font-size:13px;color:var(--muted)}
.nm{font-weight:600;font-size:15px;line-height:1.3;display:block}

.tl{text-align:left;display:block}.item.tl{display:flex}.ingb.tl{display:inline-flex}
.ck{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;color:transparent;flex:none}

.rem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--amber-s);margin-bottom:8px}

.glasses{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}

.rowh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}.hs::-webkit-scrollbar{display:none}
.rc{position:relative;flex:none;width:156px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.rc .nm{min-height:40px}.rc.wide{width:100%}.rc.wide .nm{min-height:0}
.rc .fv{position:absolute;top:10px;right:10px;color:#EF9F27}
.mark{flex:none;display:inline-block;vertical-align:-2px}
.kd{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:#9AA5A0}

.kn{font-size:14px;padding:10px 12px;border-radius:12px;margin-top:12px}
.kn.g{background:var(--leaf-s);color:var(--leaf)}.kn.a{background:var(--amber-s);color:var(--amber)}.kn.r{background:var(--red-s);color:var(--red)}
.por{background:var(--soft);border-radius:16px;padding:12px 14px;margin:14px 0 8px}
.nu{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.nu span{background:var(--card);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600}
.swr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--leaf-s);margin-top:12px}
.tog{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:#1D9E75}.tog.on::after{left:23px}
.stp{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}.stp .ib{border:1px solid var(--line);border-radius:50%}
.ing{list-style:none;padding:0;margin:8px 0 0}
.ing li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing li b{white-space:nowrap;font-weight:600}
.ingb{display:inline-flex;align-items:center;gap:8px}
.steps{padding-left:22px;margin:8px 0 0}.steps li{margin-bottom:12px;line-height:1.55}.steps b{color:var(--green-d);font-weight:700}
.tm{font-size:12px;color:var(--amber);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.box{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px;margin-top:8px}
.note{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5;max-width:560px;margin:0 auto}
.foot .btn{flex:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 12px}
.days button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;color:var(--muted);border:1px solid transparent}
.days .dd{font-size:16px;font-weight:700;color:var(--ink)}
.days button.on{background:var(--green-d);color:var(--card)}.days button.on .dd{color:var(--card)}

.flag{display:flex;gap:8px;align-items:flex-start;background:var(--amber-s);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.prog{height:6px;border-radius:3px;background:var(--soft);margin:12px 0 4px;overflow:hidden}.prog div{height:100%;background:#1D9E75}
.gi{padding:11px 0;border-top:1px solid var(--line)}.gi:first-child{border-top:0}
.gi.done .nm{text-decoration:line-through;color:var(--muted)}
.gx{margin:10px 0 2px 42px}
.addbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);z-index:4;max-width:560px;margin:0 auto}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.opt.danger{color:var(--red)}
.chkrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.chkrow input{width:22px;height:22px;accent-color:var(--green);flex:none}
.idbox{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:6px 6px 6px 12px}.idbox code{flex:1;font-size:13px;word-break:break-all}
.sw{width:44px;height:44px;border-radius:50%;font-weight:700;font-size:14px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center}.sw.on{border-color:var(--ink)}
.auth{max-width:420px;margin:0 auto;padding-top:28px}.logo{display:block;margin:0 auto 12px;border-radius:22px}
.cook{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.big-step{font-size:24px;line-height:1.5;font-weight:500;margin:24px 2px;flex:1}.big-step b{color:var(--green-d)}
.cooknav{display:flex;gap:10px;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}.cooknav .btn{flex:1;min-height:58px;font-size:17px}
.timers{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;margin-top:10px}
.tc{font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--amber-s);color:var(--amber);font-variant-numeric:tabular-nums}.tc.dn{background:var(--leaf-s);color:var(--leaf)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar[hidden]{display:none}
.tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;text-align:center}
.tab.on{color:var(--green);font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8}.scrim[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.sheet[hidden]{display:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.sheet.page{top:0;max-height:none;height:100%;border-radius:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:none}
.pop{position:fixed;z-index:12;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:240px;max-width:300px;padding:6px}
.pop[hidden]{display:none}

.pop button span{margin-left:auto}
.pop button:active,.pop button:hover{background:var(--soft)}
.pop button.danger{color:var(--red)}
.dateh{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);padding:4px 0}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .dw{font-size:12px;color:var(--muted);padding:4px 0}
.calg .cd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:10px;font-size:15px}
.calg .cd.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.calg .cd.cur{background:var(--soft)}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:15;background:var(--amber-s);color:var(--amber);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;max-width:92vw;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sync[hidden]{display:none}
.toast{display:flex;align-items:center;gap:14px}
.toast.act{pointer-events:auto}
.toast button{color:var(--mint);font-weight:700;font-size:14px;padding:4px 2px}
.flag span{flex:1}
@media (min-width:720px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:84vh;border-radius:20px;margin:0}
  .sheet.page{height:auto;max-height:88vh;border-radius:20px;padding:16px 20px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .grab{display:none}
}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){.toast,.tog::after{transition:none}}
